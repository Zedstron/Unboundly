[project]
name = "persona-chatbot"
version = "0.1.0"
description = "Persona-oriented human-like conversational agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "openai>=1.99",
  "redis>=6.4",
  "redisvl>=0.10",
  "mcp[cli]>=2.0",
  "aiosqlite",
  "colorlog>=6.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "httpx>=0.28",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
