services:
  redis:
    image: redis/redis-stack:latest
    container_name: persona-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  persona:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: persona-engine
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - persona-data:/app/data
      - ./personas:/app/personas
    working_dir: /app
    command: sh -lc "mkdir -p /app/data && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  redis-data:
  persona-data:
